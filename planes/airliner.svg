    <rect x="38" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="44" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="50" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="56" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="62" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="68" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="74" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="80" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="86" y="60" width="1.7" height="2.5" rx="0.75"/>
    <rect x="92" y="60" width="1.7" height="2.5" rx="0.75"/>
  </g>
  <g fill="none" stroke="#71889a" stroke-width="0.4">
    <rect x="31" y="59" width="3" height="9" rx="1"/>
    <rect x="99" y="59" width="3" height="9" rx="1"/>
    <path d="M33 63 L32 63 M101 63 L100 63"/>
  </g>
  <!-- Swept wing, flap seams, and a turned-up wingtip. -->
  <path d="M76 66 Q65 71 55 78 L33 89 L27 89 L52 68 L61 65Z"
