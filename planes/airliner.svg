  <path d="M14 60 L6 34 L18 34 L34 58 Z" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- fuselage -->
  <path d="M10 60 Q10 54 22 54 L104 54 Q122 55 124 63 Q122 70 104 72 L26 72 Q14 72 10 66 Z"
        fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
