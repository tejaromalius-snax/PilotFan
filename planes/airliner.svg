  <g fill="#38bdf8">
    <circle cx="36" cy="60" r="1.8"/><circle cx="44" cy="60" r="1.8"/><circle cx="52" cy="60" r="1.8"/>
    <circle cx="60" cy="60" r="1.8"/><circle cx="68" cy="60" r="1.8"/><circle cx="76" cy="60" r="1.8"/>
    <circle cx="84" cy="60" r="1.8"/><circle cx="92" cy="60" r="1.8"/><circle cx="100" cy="60" r="1.8"/>
  </g>
  <!-- near wing -->
  <path d="M74 66 L48 92 L38 92 L54 66 Z" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- engine -->
  <rect x="52" y="74" width="20" height="8" rx="4" fill="#64748b" stroke="#1e293b" stroke-width="1.5"/>
  <!-- stabilizer -->
  <path d="M28 64 L12 74 L20 74 L36 66 Z" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.2"/>
