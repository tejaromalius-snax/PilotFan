<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a5b6c6"/><stop offset="0.23" stop-color="#fff"/>
      <stop offset="0.52" stop-color="#f1f5f8"/><stop offset="0.8" stop-color="#bdcbd7"/>
      <stop offset="1" stop-color="#6c8194"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0.3" y2="1">
      <stop stop-color="#e5ecf0"/><stop offset="0.5" stop-color="#aabac7"/>
      <stop offset="1" stop-color="#72899c"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0.8">
      <stop stop-color="#508bc4"/><stop offset="1" stop-color="#123f70"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7eacbf"/><stop offset="0.45" stop-color="#25475b"/>
      <stop offset="1" stop-color="#102c3e"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8096a8"/><stop offset="0.3" stop-color="#f2f6f8"/>
      <stop offset="0.65" stop-color="#d2dce3"/><stop offset="1" stop-color="#6d8192"/>
    </linearGradient>
  </defs>
  <!-- Far surfaces sit behind the fuselage. -->
  <path d="M57 59 L32 43 L26 43 L44 61Z" fill="#7e94a6" stroke="#5c758b" stroke-width="0.5"/>
  <path d="M17 61 L6 54 L4 54 L9 63Z" fill="#8da1b1"/>
