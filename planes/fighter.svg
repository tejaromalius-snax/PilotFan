    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#66717b"/><stop offset="0.45" stop-color="#28323e"/>
      <stop offset="0.7" stop-color="#5a6973"/><stop offset="1" stop-color="#1c2934"/>
    </linearGradient>
  </defs>
  <!-- Far wing and swept vertical stabilizer. -->
  <path d="M66 60 L35 44 L22 45 L47 63Z" fill="#526b7b" stroke="#405b6e" stroke-width="0.5"/>
