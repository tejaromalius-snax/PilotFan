<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a8b6bd"/><stop offset="0.3" stop-color="#c7d1d5"/>
      <stop offset="0.55" stop-color="#889ba6"/><stop offset="1" stop-color="#405768"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0.4" y2="1">
