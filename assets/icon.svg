<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="44" y1="226" x2="140" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="trail2" x1="26" y1="204" x2="134" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0.85"/>
    </linearGradient>
    <path id="plane" d="M0 -60 C6 -60 8 -50 8 -40 L8 -8 L56 16 L56 28 L8 14 L8 36 L22 48 L22 56 L0 50 L-22 56 L-22 48 L-8 36 L-8 14 L-56 28 L-56 16 L-8 -8 L-8 -40 C-8 -50 -6 -60 0 -60 Z"/>
    <path id="blade" d="M0 0 C8 -18 34 -40 46 -16 C34 -8 16 -2 0 0 Z"/>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <!-- fan -->
    <g transform="translate(76 184)" fill="#ffffff">
      <circle r="56" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5"/>
      <g fill-opacity="0.16">
        <use href="#blade" transform="scale(1.05)"/>
        <use href="#blade" transform="rotate(120) scale(1.05)"/>
        <use href="#blade" transform="rotate(240) scale(1.05)"/>
      </g>
      <circle r="9" fill-opacity="0.3"/>
    </g>

    <!-- contrails -->
    <path d="M44 226 C92 216 120 166 140 112" fill="none" stroke="url(#trail)" stroke-width="10" stroke-linecap="round"/>
    <path d="M26 204 C74 194 106 152 134 106" fill="none" stroke="url(#trail2)" stroke-width="5" stroke-linecap="round"/>

    <!-- sparkles -->
    <g fill="#ffffff">
      <path d="M58 52 L61 62 L71 65 L61 68 L58 78 L55 68 L45 65 L55 62 Z" fill-opacity="0.85"/>
      <circle cx="96" cy="40" r="2.5" fill-opacity="0.7"/>
      <circle cx="210" cy="190" r="3" fill-opacity="0.5"/>
      <circle cx="40" cy="110" r="2" fill-opacity="0.6"/>
    </g>

    <!-- plane -->
    <use href="#plane" transform="translate(178 86) rotate(45) scale(0.8)" fill="#1e1b4b" fill-opacity="0.3"/>
    <use href="#plane" transform="translate(172 80) rotate(45) scale(0.8)" fill="#ffffff"/>
  </g>
</svg>
